<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><script>
/* =====================================================================
   إعدادات المزامنة السحابية (Firebase Firestore) — عدّل هذه القيم فقط
   الخطوات الكاملة في ملف README-setup-ar.md
   ===================================================================== */
window.APP_CONFIG = {
  provider: "supabase",   // "supabase" (موصى به هنا) أو "firebase"
  supabase: {
    url: "",              // مثال: https://abcdxyz.supabase.co
    anonKey: ""           // المفتاح العام anon public
  },
  firebase: {             // اتركه فارغاً إذا تستخدم Supabase
    apiKey: "",
    projectId: ""
  },
  useAnonymousAuth: true  // خاص بـ Firebase فقط
};

/* ===================== طبقة البيانات (لا تعدّلها) ===================== */
(function () {
  "use strict";
  var CFG = window.APP_CONFIG || {};
  var FB = CFG.firebase || {};
  var SB = CFG.supabase || {};
  var SBURL = String(SB.url || "").replace(/\/+$/, "");
  var USE_SB = (CFG.provider || "supabase") === "supabase";
  var CLOUD = USE_SB ? !!(SBURL && SB.anonKey) : !!(FB.apiKey && FB.projectId);
  var PAGE = 300;
  var LS = (function () {
    try { var t = "__t"; localStorage.setItem(t, "1"); localStorage.removeItem(t); return localStorage; }
    catch (e) { var m = {}; return { getItem: function (k) { return k in m ? m[k] : null; }, setItem: function (k, v) { m[k] = String(v); }, removeItem: function (k) { delete m[k]; } }; }
  })();
  function jget(k, d) { try { var v = LS.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function jset(k, v) { try { LS.setItem(k, JSON.stringify(v)); } catch (e) { /* التخزين ممتلئ */ } }
  function sanitizeId(s) { return String(s).replace(/[^A-Za-z0-9_\-]/g, "_").slice(0, 200) || ("r" + Date.now()); }

  /* ---------- وضع محلي (عند عدم ضبط Firebase): جهاز واحد فقط ---------- */
  var Local = {
    key: function (c) { return "att_local_" + c; },
    all: function (c) { return jget(Local.key(c), []); },
    upsert: function (c, id, value) {
      var arr = Local.all(c), now = new Date().toISOString(), hit = false;
      for (var i = 0; i < arr.length; i++) if (arr[i].id === id) { arr[i] = { id: id, value: value, updated_at: now }; hit = true; }
      if (!hit) arr.push({ id: id, value: value, updated_at: now });
      jset(Local.key(c), arr);
      return { id: id, updated_at: now };
    },
    list: function (c) { return { records: Local.all(c).sort(byTime), next_cursor: null }; }
  };
  function byTime(a, b) {
    return (a.updated_at || "") < (b.updated_at || "") ? -1 : (a.updated_at || "") > (b.updated_at || "") ? 1 : (a.id < b.id ? -1 : 1);
  }

  /* ---------- مصادقة مجهولة عبر REST ---------- */
  var inflightAuth = null;
  function authToken(force) {
    if (!CFG.useAnonymousAuth) return Promise.resolve(null);
    var a = jget("att_auth", null);
    if (!force && a && a.exp - 60000 > Date.now()) return Promise.resolve(a.idToken);
    if (inflightAuth) return inflightAuth;
    inflightAuth = (async function () {
      try {
        if (a && a.refreshToken) {
          try {
            var r = await fetch("https://securetoken.googleapis.com/v1/token?key=" + encodeURIComponent(FB.apiKey), {
              method: "POST",
              headers: { "content-type": "application/x-www-form-urlencoded" },
              body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(a.refreshToken)
            });
            var j = await r.json();
            if (r.ok && j.id_token) {
              var na = { idToken: j.id_token, refreshToken: j.refresh_token || a.refreshToken, exp: Date.now() + Number(j.expires_in || 3600) * 1000 };
              jset("att_auth", na); return na.idToken;
            }
          } catch (e) { if (e instanceof TypeError) throw e; /* خطأ شبكة: لا ننشئ مستخدماً جديداً */ }
        }
        var r2 = await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=" + encodeURIComponent(FB.apiKey), {
          method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ returnSecureToken: true })
        });
        var j2 = await r2.json();
        if (!r2.ok || !j2.idToken) {
          var msg = (j2 && j2.error && j2.error.message) || ("HTTP " + r2.status);
          throw new Error(/OPERATION_NOT_ALLOWED|ADMIN_ONLY/.test(msg) ? "فعّل Authentication > Anonymous في Firebase" : "فشل تسجيل الدخول للسحابة: " + msg);
        }
        var n2 = { idToken: j2.idToken, refreshToken: j2.refreshToken, exp: Date.now() + Number(j2.expiresIn || 3600) * 1000 };
        jset("att_auth", n2); return n2.idToken;
      } finally { inflightAuth = null; }
    })();
    return inflightAuth;
  }

  var ROOT = "https://firestore.googleapis.com/v1/projects/" + encodeURIComponent(FB.projectId || "x") + "/databases/(default)/documents";
  var DOCNAME = "projects/" + (FB.projectId || "x") + "/databases/(default)/documents/";

  async function fs(path, body, retried) {
    var tok = await authToken(false);
    var headers = { "content-type": "application/json" };
    if (tok) headers.Authorization = "Bearer " + tok;
    var res = await fetch(ROOT + path + "?key=" + encodeURIComponent(FB.apiKey), { method: "POST", headers: headers, body: JSON.stringify(body) });
    var data = null; try { data = await res.json(); } catch (e) { /* ignore */ }
    if (res.status === 401 && !retried && CFG.useAnonymousAuth) { await authToken(true); return fs(path, body, true); }
    if (!res.ok) {
      var m = data && (data.error && data.error.message || (data[0] && data[0].error && data[0].error.message));
      throw new Error(res.status === 403 ? "صلاحيات قاعدة البيانات مرفوضة — تحقق من قواعد Firestore (" + (m || "403") + ")" : (m || "HTTP " + res.status));
    }
    return data;
  }

  /* ---------- ذاكرة محلية + مزامنة تزايدية (تقرأ المستندات المتغيّرة فقط) ---------- */
  var caches = {}, inflight = {};
  function cache(c) {
    if (!caches[c]) caches[c] = jget("att_cache_" + c, { lastTs: null, docs: {} });
    return caches[c];
  }
  function saveCache(c) { jset("att_cache_" + c, caches[c]); }
  function parseDoc(d) {
    var f = d.fields || {}, id = String(d.name).split("/").pop(), v = null;
    try { v = JSON.parse(f.v && f.v.stringValue); } catch (e) { return null; }
    var ts = (f.ts && f.ts.timestampValue) || d.updateTime || null;
    return { id: id, value: v, ts: ts };
  }
  async function pull(c) {
    var ch = cache(c), guard = 0;
    // نعيد قراءة نافذة تداخل قصيرة (ثانيتان) فقط تحسّباً لتأخر ظهور الكتابات المتزامنة
    var cursor = ch.lastTs ? new Date(Date.parse(ch.lastTs) - 2000).toISOString() : null;
    while (guard++ < 500) {
      var sq = { from: [{ collectionId: c }], orderBy: [{ field: { fieldPath: "ts" }, direction: "ASCENDING" }], limit: PAGE };
      if (cursor) sq.where = { fieldFilter: { field: { fieldPath: "ts" }, op: "GREATER_THAN_OR_EQUAL", value: { timestampValue: cursor } } };
      var rows = await fs(":runQuery", { structuredQuery: sq });
      var docs = (rows || []).filter(function (r) { return r && r.document; }).map(function (r) { return parseDoc(r.document); }).filter(Boolean);
      docs.forEach(function (d) {
        ch.docs[d.id] = { value: d.value, updated_at: d.ts };
        if (!ch.lastTs || d.ts > ch.lastTs) ch.lastTs = d.ts;
      });
      if (docs.length < PAGE) break;
      var last = docs[docs.length - 1].ts;
      if (last === cursor) break;
      cursor = last;
    }
    saveCache(c);
  }
  function fromCache(c) {
    var ch = cache(c);
    var recs = Object.keys(ch.docs).map(function (id) { return { id: id, value: ch.docs[id].value, updated_at: ch.docs[id].updated_at }; });
    return { records: recs.sort(byTime), next_cursor: null };
  }
  var lastPull = {};
  // أقل فاصل بين استعلامين لكل مجموعة (ms): الحضور سريع، والقوائم/الإعدادات أبطأ لتوفير الحصة المجانية
  function minGap(c) { return c === "attendance" ? 3000 : (USE_SB ? 30000 : 60000); }
  async function cloudList(c) {
    if (lastPull[c] && Date.now() - lastPull[c] < minGap(c)) return fromCache(c);
    if (!inflight[c]) inflight[c] = (USE_SB ? sbPull(c) : pull(c)).then(function () { lastPull[c] = Date.now(); }).finally(function () { delete inflight[c]; });
    try { await inflight[c]; api.lastError = null; }
    catch (e) {
      api.lastError = e.message || String(e);
      if (!Object.keys(cache(c).docs).length) throw e; // لا بيانات محفوظة: أخبر التطبيق بالفشل
    }
    return fromCache(c);
  }
  async function cloudWrite(c, id, value) {
    id = sanitizeId(id);
    var r = await fs(":commit", { writes: [{
      update: { name: DOCNAME + c + "/" + id, fields: { v: { stringValue: JSON.stringify(value) } } },
      updateMask: { fieldPaths: ["v"] },
      updateTransforms: [{ fieldPath: "ts", setToServerValue: "REQUEST_TIME" }]
    }] });
    var ts = (r && r.commitTime) || new Date().toISOString();
    var ch = cache(c); ch.docs[id] = { value: value, updated_at: ts }; saveCache(c);
    lastPull[c] = 0; // اسحب التغييرات فوراً في الاستعلام التالي
    return { id: id, updated_at: ts };
  }

  /* ---------- Supabase (PostgREST) ---------- */
  function sbHeaders(extra) {
    var h = { apikey: SB.anonKey, Authorization: "Bearer " + SB.anonKey, "content-type": "application/json" };
    for (var k in (extra || {})) h[k] = extra[k];
    return h;
  }
  async function sbFetch(qs, opts) {
    var res = await fetch(SBURL + "/rest/v1/records" + qs, opts);
    var data = null; try { data = await res.json(); } catch (e) { /* ignore */ }
    if (!res.ok) {
      var m = data && (data.message || data.hint || data.error_description);
      throw new Error(res.status === 401 || res.status === 403 ? "مفتاح Supabase أو صلاحيات الجدول غير صحيحة (" + (m || res.status) + ")" : (m || "HTTP " + res.status));
    }
    return data;
  }
  async function sbPull(c) {
    var ch = cache(c), guard = 0, LIM = 1000;
    var cursor = ch.lastTs ? new Date(Date.parse(ch.lastTs) - 2000).toISOString() : null;
    while (guard++ < 500) {
      var qs = "?select=id,value,updated_at&collection=eq." + encodeURIComponent(c) +
        (cursor ? "&updated_at=gte." + encodeURIComponent(cursor) : "") +
        "&order=updated_at.asc,id.asc&limit=" + LIM;
      var rows = await sbFetch(qs, { method: "GET", headers: sbHeaders() });
      rows = rows || [];
      rows.forEach(function (r) {
        ch.docs[r.id] = { value: r.value, updated_at: r.updated_at };
        if (!ch.lastTs || Date.parse(r.updated_at) > Date.parse(ch.lastTs)) ch.lastTs = r.updated_at;
      });
      if (rows.length < LIM) break;
      var last = rows[rows.length - 1].updated_at;
      if (last === cursor) break;
      cursor = last;
    }
    saveCache(c);
  }
  async function sbWrite(c, id, value) {
    id = sanitizeId(id);
    var rows = await sbFetch("?on_conflict=collection,id", {
      method: "POST",
      headers: sbHeaders({ Prefer: "resolution=merge-duplicates,return=representation" }),
      body: JSON.stringify({ collection: c, id: id, value: value })
    });
    var ts = (rows && rows[0] && rows[0].updated_at) || new Date().toISOString();
    var ch = cache(c); ch.docs[id] = { value: value, updated_at: ts }; saveCache(c);
    lastPull[c] = 0;
    return { id: id, updated_at: ts };
  }

  /* ---------- واجهة موحّدة يستدعيها التطبيق ---------- */
  var api = {
    cloud: CLOUD,
    lastError: null,
    call: async function (action, args) {
      args = args || {};
      var c = args.collection;
      if (action === "records.list") return CLOUD ? cloudList(c) : Local.list(c);
      if (action === "records.create") {
        var id = args.idempotency_key || ("r" + Date.now() + Math.random().toString(36).slice(2, 8));
        return CLOUD ? (USE_SB ? sbWrite(c, id, args.value) : cloudWrite(c, id, args.value)) : Local.upsert(c, sanitizeId(id), args.value);
      }
      if (action === "records.replace") return CLOUD ? (USE_SB ? sbWrite(c, args.id, args.value) : cloudWrite(c, args.id, args.value)) : Local.upsert(c, args.id, args.value);
      throw new Error("إجراء غير مدعوم: " + action);
    }
  };
  window.__DB = api;

  /* دالة تهريب النصوص للتصدير */
  window.__esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (ch) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]; });
  };

  /* تنبيه ظاهر إذا لم تُضبط السحابة */
  if (!CLOUD) {
    document.addEventListener("DOMContentLoaded", function () {
      var b = document.createElement("div");
      b.setAttribute("role", "alert");
      b.style.cssText = "position:fixed;bottom:0;inset-inline:0;z-index:99999;background:#b91c1c;color:#fff;padding:10px 14px;font:700 13px/1.5 Cairo,Tajawal,system-ui,sans-serif;text-align:center;direction:rtl";
      b.textContent = "⚠ المزامنة السحابية غير مفعّلة: التسجيلات تُحفظ على هذا الجهاز فقط ولن تظهر للمدير. أكمل إعداد Supabase (انظر README-supabase-ar.md).";
      document.body.appendChild(b);
    });
  }
})();
